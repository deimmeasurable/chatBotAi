spring.application.name=AichatBot

# Correct properties for Google AI Studio (API Key approach)
langchain4j.google-ai-gemini.chat-model.api-key=AIzaSyA4FEO7VdY2uEYKMxzf3QoDL8hmiAfCjSk
langchain4j.google-ai-gemini.chat-model.model-name=gemini-2.5-flash
logistics.customs.api-url=https://comtrade.un.org/data/doc/api/

#barcode and image scanning
barcode.api.url= "https://world.openfoodfacts.org/api/v0/product/barcode.json
#barcode.api.key=K89751167088957
vision.api.url=https://api.ocr.space/parse/image
vision.api.key=K89751167088957

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=


# Google Cloud Project ID
spring.ai.vertex.ai.gemini.project-id=

# Google Cloud Region
spring.ai.vertex.ai.gemini.location=us-central1

# Chat Model
spring.ai.vertex.ai.gemini.model=gemini-2.5-flash
spring.ai.vertex.ai.gemini.chat.options.response-timeout=120s
spring.ai.vertex.ai.gemini.chat.options.connect-timeout=120s
spring.ai.vertex.ai.gemini.chat.options.temperature=0.2

# Embedding Model
spring.ai.vertex.ai.embedding.location=us-central1
spring.ai.vertex.ai.embedding.text.options.model=gemini-embedding-001



server.port=${PORT:8080}
spring.jpa.database=POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5434/chat
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=user
spring.jpa.show-sql=true
logging.level.org.springframework.web=debug
logging.level.org.hibernate=debug
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

spring.ai.vertex.ai.gemini.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

